name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Forge MDK 1.20.1
        run: |
          curl -L -f -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-mdk.zip
          mkdir mdk
          unzip -q mdk.zip -d mdk

      - name: Use the clone mod sources
        run: |
          rm -rf mdk/src
          cp -r src mdk/src

      - name: Build
        working-directory: mdk
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: clone-mod-jar
          path: mdk/build/libs/*.jar
